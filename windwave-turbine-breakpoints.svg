<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="CSS media query breakpoints for desktop, tablet and mobile">
  <rect width="600" height="320" rx="14" fill="#7b5cff"/>
  <text x="300" y="46" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff">CSS Media Queries Breakpoint</text>
  <text x="300" y="76" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#e8e2ff">@media only screen and (max-width: ...) { ... }</text>

  <!-- Desktop -->
  <rect x="30" y="100" width="260" height="170" rx="8" fill="#fff" stroke="#2a1f6b" stroke-width="3"/>
  <rect x="42" y="112" width="236" height="30" rx="3" fill="#cfd3ee"/>
  <rect x="42" y="150" width="74" height="40" rx="3" fill="#cfd3ee"/>
  <rect x="123" y="150" width="74" height="40" rx="3" fill="#cfd3ee"/>
  <rect x="204" y="150" width="74" height="40" rx="3" fill="#cfd3ee"/>
  <rect x="42" y="198" width="236" height="60" rx="3" fill="#cfd3ee"/>
  <text x="160" y="292" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Desktop · 3 columns</text>

  <!-- Tablet -->
  <rect x="315" y="100" width="150" height="170" rx="8" fill="#fff" stroke="#2a1f6b" stroke-width="3"/>
  <rect x="325" y="110" width="130" height="26" rx="3" fill="#cfd3ee"/>
  <rect x="325" y="144" width="62" height="34" rx="3" fill="#cfd3ee"/>
  <rect x="393" y="144" width="62" height="34" rx="3" fill="#cfd3ee"/>
  <rect x="325" y="186" width="62" height="34" rx="3" fill="#cfd3ee"/>
  <rect x="393" y="186" width="62" height="34" rx="3" fill="#cfd3ee"/>
  <rect x="325" y="228" width="130" height="32" rx="3" fill="#cfd3ee"/>
  <text x="390" y="292" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Tablet · 2 columns</text>

  <!-- Mobile -->
  <rect x="490" y="100" width="82" height="170" rx="10" fill="#fff" stroke="#2a1f6b" stroke-width="3"/>
  <rect x="499" y="112" width="64" height="22" rx="3" fill="#cfd3ee"/>
  <rect x="499" y="142" width="64" height="26" rx="3" fill="#cfd3ee"/>
  <rect x="499" y="176" width="64" height="26" rx="3" fill="#cfd3ee"/>
  <rect x="499" y="210" width="64" height="26" rx="3" fill="#cfd3ee"/>
  <rect x="499" y="244" width="64" height="18" rx="3" fill="#cfd3ee"/>
  <text x="531" y="292" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Mobile · 1 col</text>
</svg>
